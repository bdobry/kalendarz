name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Keep the prerendered "next long weekend" answer current for crawlers too.
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Refresh official school calendar
        run: npm run data:school:check
      - name: Persist verified school dates
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git add data/schoolBreaks.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh official school calendar"
            git push
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:run
      - name: Calendar dates in Poland timezone
        run: npm exec vitest -- run utils/calendarExportUtils.test.ts utils/upcomingBreaks.test.ts
        env:
          TZ: Europe/Warsaw
      - name: Build and verify static SEO
        run: npm run build
        env:
          TZ: UTC
          SCHOOL_DATA_OFFLINE: "1"
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
